<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot head -->
  <rect x="60" y="60" width="80" height="80" rx="10" fill="#3578E5" stroke="#1C4587" stroke-width="3"/>

  <!-- Eyes -->
  <circle cx="80" cy="90" r="8" fill="#FFF"/>
  <circle cx="120" cy="90" r="8" fill="#FFF"/>
  <circle cx="82" cy="88" r="4" fill="#1C4587"/>
  <circle cx="122" cy="88" r="4" fill="#1C4587"/>

  <!-- Antenna -->
  <line x1="100" y1="60" x2="100" y2="40" stroke="#3578E5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="35" r="5" fill="#FFC107"/>

  <!-- Mouth -->
  <path d="M 80 115 Q 100 125 120 115" stroke="#1C4587" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- AI Symbol -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1C4587" text-anchor="middle">AI</text>
</svg>
